name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Only the libraries the tests need; the full Poetry env pulls in
      # tensorflow/jupyter and is much slower to install.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Ranges follow pyproject/poetry.lock (numpy<2, pandas 2.x).
          # python-dotenv: importing the chasm package loads .env.
          pip install "numpy<2" "pandas<3" scipy scikit-learn statsmodels python-dotenv pytest
      - name: Run tests
        run: pytest -q
