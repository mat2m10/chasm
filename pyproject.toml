[tool.poetry]
name = "chasm"
version = "0.1.0"
description = "Simulation toolkit for genotype-phenotype data under population structure, for testing GWAS stratification correction (PCs vs. allele frequencies)"
authors = ["Matthieu de Hemptinne"]
readme = "README.md"
homepage = "https://github.com/mat2m10/chasm"
repository = "https://github.com/mat2m10/chasm"
packages = [{ include = "chasm" }]

[tool.poetry.dependencies]
python = "^3.10"

# Notebook support
ipykernel = "*"
ipython = "*"
jupyter = "*"

# Core data stack
pandas = "*"
numpy = "<2"
scipy = "*"
matplotlib = "*"
seaborn = "*"

# ML & statistics
tensorflow = "*"
scikit-learn = "*"
statsmodels = "*"
umap-learn = "*"
hdbscan = "*"
k-means-constrained = "*"

# Utilities
termcolor = "*"
python-dotenv = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
