[tool.poetry]
name = "chasm"
version = "0.1.0"
description = "Simulation toolkit for genotype-phenotype data under population structure, for testing GWAS stratification correction (PCs vs. allele frequencies)"
authors = ["Matthieu de Hemptinne"]
readme = "README.md"
homepage = "https://github.com/mat2m10/chasm"
repository = "https://github.com/mat2m10/chasm"
packages = [{ include = "chasm" }]

[tool.poetry.dependencies]
python = "^3.10"
# Lower bounds = the oldest version currently in poetry.lock (major.minor),
# so a fresh `poetry lock` cannot fall back to much older releases.

# Notebook support
ipykernel = ">=6.30"
ipython = ">=8.37"
jupyter = ">=1.1"

# Core data stack
pandas = ">=2.3"
numpy = ">=1.26,<2"
scipy = ">=1.15"
matplotlib = ">=3.10"
seaborn = ">=0.13"

# ML & statistics
tensorflow = ">=2.18"
scikit-learn = ">=1.7"
statsmodels = ">=0.14"

# Population-genetics simulation / IO
msprime = ">=1.3"
bed-reader = ">=1.0"

# Utilities
termcolor = ">=3.1"
python-dotenv = ">=1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
